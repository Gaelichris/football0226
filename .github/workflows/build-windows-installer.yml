name: Build Windows Installer

on:
  push:
    branches: [main, master, 'qoder/**']
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        default: 'false'
        type: boolean

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-win-${{ hashFiles('vcpkg.json') }}-v3
          restore-keys: vcpkg-win-

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          C:\vcpkg\vcpkg.exe install sdl2:x64-windows sdl2-image:x64-windows sdl2-ttf:x64-windows sdl2-gfx:x64-windows boost-python:x64-windows boost-filesystem:x64-windows boost-thread:x64-windows boost-system:x64-windows

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pyinstaller pygame opencv-python psutil numpy absl-py six "gym<=0.21.0" cloudpickle

      - name: Build gfootball from source
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          python -m pip install .

      - name: Verify gfootball installation
        shell: pwsh
        run: |
          python -c "import gfootball; print('gfootball imported successfully')"

      - name: Create launcher script
        shell: pwsh
        run: |
          $launcherContent = @'
          import sys
          import os

          if getattr(sys, 'frozen', False):
              application_path = os.path.dirname(sys.executable)
              os.chdir(application_path)
              sys.path.insert(0, application_path)

          def main():
              try:
                  import gfootball.env as football_env
                  env = football_env.create_environment(
                      env_name='11_vs_11_easy_stochastic',
                      render=True,
                      representation='raw',
                      number_of_left_players_agent_controls=1,
                      stacked=False,
                      write_video=False,
                      write_full_episode_dumps=False,
                      write_goal_dumps=False
                  )
                  print("Google Research Football")
                  print("=" * 40)
                  print("Controls: Arrow Keys=Move, S=Pass, D=Shoot, E=Sprint")
                  print("Press Ctrl+C to quit")
                  obs = env.reset()
                  while True:
                      action = 0
                      obs, reward, done, info = env.step(action)
                      if done:
                          obs = env.reset()
              except KeyboardInterrupt:
                  print("\nGame ended")
              except Exception as e:
                  print(f"Error: {e}")
                  import traceback
                  traceback.print_exc()
                  input("Press Enter to exit...")
              finally:
                  try:
                      env.close()
                  except:
                      pass

          if __name__ == '__main__':
              main()
          '@
          Set-Content -Path "launcher.py" -Value $launcherContent -Encoding UTF8

      - name: Create PyInstaller spec via Python
        shell: pwsh
        run: |
          python create_pyinstaller_spec.py

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          pyinstaller gfootball.spec --clean --noconfirm
        continue-on-error: true

      - name: Copy additional data files
        shell: pwsh
        run: |
          $enginePath = python -c "import gfootball_engine; import os; print(os.path.dirname(gfootball_engine.__file__))"
          $enginePath = $enginePath.Trim()
          if (Test-Path "dist\gfootball") {
            $dataTarget = "dist\gfootball\gfootball_engine\data"
            $fontsTarget = "dist\gfootball\gfootball_engine\fonts"
            if (-not (Test-Path $dataTarget)) {
              Copy-Item -Path "$enginePath\data" -Destination $dataTarget -Recurse -Force
            }
            if (-not (Test-Path $fontsTarget)) {
              Copy-Item -Path "$enginePath\fonts" -Destination $fontsTarget -Recurse -Force
            }
          }
        continue-on-error: true

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Create NSIS installer script
        shell: pwsh
        run: |
          $nsiContent = @'
          !include "MUI2.nsh"

          Name "Google Research Football"
          OutFile "GFootball_Setup.exe"
          InstallDir "$PROGRAMFILES64\Google Research Football"
          RequestExecutionLevel admin

          !define MUI_ABORTWARNING

          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH

          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES

          !insertmacro MUI_LANGUAGE "English"

          Section "Install"
              SetOutPath "$INSTDIR"
              File /r "dist\gfootball\*.*"

              CreateDirectory "$SMPROGRAMS\Google Research Football"
              CreateShortcut "$SMPROGRAMS\Google Research Football\GFootball.lnk" "$INSTDIR\GFootball.exe"
              CreateShortcut "$SMPROGRAMS\Google Research Football\Uninstall.lnk" "$INSTDIR\uninstall.exe"
              CreateShortcut "$DESKTOP\Google Research Football.lnk" "$INSTDIR\GFootball.exe"

              WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\GFootball" "DisplayName" "Google Research Football"
              WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\GFootball" "UninstallString" "$INSTDIR\uninstall.exe"
              WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\GFootball" "Publisher" "Google Research"
              WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\GFootball" "DisplayVersion" "2.10.3"

              WriteUninstaller "$INSTDIR\uninstall.exe"
          SectionEnd

          Section "Uninstall"
              RMDir /r "$INSTDIR"
              RMDir /r "$SMPROGRAMS\Google Research Football"
              Delete "$DESKTOP\Google Research Football.lnk"
              DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\GFootball"
          SectionEnd
          '@
          Set-Content -Path "installer.nsi" -Value $nsiContent -Encoding ASCII

      - name: Build NSIS installer
        shell: pwsh
        run: |
          if (Test-Path "dist\gfootball") {
            & "C:\Program Files (x86)\NSIS\makensis.exe" installer.nsi
          } else {
            Write-Host "PyInstaller dist not found, skipping NSIS"
          }
        continue-on-error: true

      - name: Create portable zip (fallback)
        shell: pwsh
        run: |
          if (Test-Path "dist\gfootball") {
            Compress-Archive -Path "dist\gfootball\*" -DestinationPath "GFootball_Portable.zip"
          }
        continue-on-error: true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: GFootball-Windows-Installer
          path: |
            GFootball_Setup.exe
            GFootball_Portable.zip
          if-no-files-found: warn

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: |
            build/
            *.log
          if-no-files-found: ignore

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: GFootball-Windows-Installer

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            GFootball_Setup.exe
            GFootball_Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
