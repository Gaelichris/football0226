name: Build Windows Installer

on:
  push:
    branches: [main, master, 'qoder/**']
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        default: 'false'
        type: boolean

env:
  # Enable debug logging for all steps
  ACTIONS_STEP_DEBUG: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Debug - Show environment info
        shell: pwsh
        run: |
          Write-Host "=== System Info ==="
          python --version
          pip --version
          cmake --version
          Write-Host "=== Environment Variables ==="
          Get-ChildItem Env: | Sort-Object Name | Format-Table -AutoSize
          Write-Host "=== Disk Space ==="
          Get-PSDrive -PSProvider FileSystem | Format-Table Name,Used,Free -AutoSize

      # gfootball uses vcpkg manifest mode - CMake handles dependencies automatically
      - name: Install vcpkg
        shell: pwsh
        run: |
          Write-Host "::group::Cloning vcpkg"
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          Write-Host "::endgroup::"
          Write-Host "::group::Bootstrapping vcpkg"
          C:\vcpkg\bootstrap-vcpkg.bat
          Write-Host "::endgroup::"
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          Write-Host "vcpkg installed at C:\vcpkg"

      - name: Upgrade pip and install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel psutil numpy
          pip list

      - name: Build and install gfootball
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
        run: |
          Write-Host "=== Environment check ==="
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "Python arch: $(python -c 'import struct; print(struct.calcsize(\"P\")*8)')-bit"
          Write-Host ""
          Write-Host "=== Starting build (no-build-isolation to see CMake output) ==="
          python -m pip install . --no-build-isolation -v
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Verify gfootball installation
        shell: pwsh
        run: |
          Write-Host "=== Installed packages ==="
          pip list
          Write-Host "=== Import test ==="
          python -c "import gfootball; print('gfootball imported successfully')"
          python -c "import gymnasium; print(f'gymnasium version: {gymnasium.__version__}')"
          python -c "import gfootball_engine; print('gfootball_engine imported successfully')"

      - name: Install PyInstaller and runtime dependencies
        shell: pwsh
        run: |
          python -m pip install pyinstaller pygame opencv-python numpy absl-py six "gymnasium>=0.26.0" cloudpickle -v
          Write-Host "=== Final package list ==="
          pip list

      - name: Create launcher script
        shell: pwsh
        run: |
          $content = @'
          import sys, os
          if getattr(sys, 'frozen', False):
              app_path = os.path.dirname(sys.executable)
              os.chdir(app_path)
              sys.path.insert(0, app_path)
          def main():
              try:
                  import gfootball.env as football_env
                  env = football_env.create_environment(
                      env_name='11_vs_11_easy_stochastic', render=True,
                      representation='raw', number_of_left_players_agent_controls=1,
                      stacked=False, write_video=False,
                      write_full_episode_dumps=False, write_goal_dumps=False)
                  print("Google Research Football")
                  print("Controls: Arrows=Move, S=Pass, D=Shoot, E=Sprint, Ctrl+C=Quit")
                  obs, info = env.reset()
                  while True:
                      obs, reward, terminated, truncated, info = env.step(0)
                      if terminated or truncated: obs, info = env.reset()
              except KeyboardInterrupt: print("\nGame ended")
              except Exception as e:
                  print(f"Error: {e}")
                  import traceback; traceback.print_exc()
                  input("Press Enter to exit...")
              finally:
                  try: env.close()
                  except: pass
          if __name__ == '__main__': main()
          '@
          Set-Content -Path "launcher.py" -Value $content -Encoding UTF8

      - name: Generate PyInstaller spec
        shell: pwsh
        run: |
          python create_pyinstaller_spec.py

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          Write-Host "::group::PyInstaller build"
          pyinstaller gfootball.spec --clean --noconfirm --log-level=DEBUG 2>&1 | Tee-Object -FilePath pyinstaller.log
          Write-Host "::endgroup::"
          if (Test-Path "dist\gfootball\GFootball.exe") {
            Write-Host "Build successful: dist\gfootball\GFootball.exe"
            Get-Item "dist\gfootball\GFootball.exe" | Format-List Name,Length,LastWriteTime
          } else {
            Write-Host "::error::PyInstaller output executable not found"
            Write-Host "=== Last 50 lines of pyinstaller log ==="
            Get-Content pyinstaller.log | Select-Object -Last 50
          }

      - name: Copy data files
        shell: pwsh
        run: |
          $enginePath = (python -c "import gfootball_engine; import os; print(os.path.dirname(gfootball_engine.__file__))").Trim()
          Write-Host "Engine path: $enginePath"
          if (Test-Path "dist\gfootball") {
            if (-not (Test-Path "dist\gfootball\gfootball_engine\data")) {
              Write-Host "Copying data files..."
              Copy-Item -Path "$enginePath\data" -Destination "dist\gfootball\gfootball_engine\data" -Recurse -Force
            }
            if (-not (Test-Path "dist\gfootball\gfootball_engine\fonts")) {
              Write-Host "Copying font files..."
              Copy-Item -Path "$enginePath\fonts" -Destination "dist\gfootball\gfootball_engine\fonts" -Recurse -Force
            }
            Write-Host "=== dist\gfootball contents ==="
            Get-ChildItem "dist\gfootball" -Recurse | Measure-Object -Property Length -Sum | ForEach-Object { Write-Host "Total files: $($_.Count), Total size: $([math]::Round($_.Sum / 1MB, 2)) MB" }
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Create NSIS script
        shell: pwsh
        run: |
          $nsi = @'
          !include "MUI2.nsh"
          Name "Google Research Football"
          OutFile "GFootball_Setup.exe"
          InstallDir "$PROGRAMFILES64\Google Research Football"
          RequestExecutionLevel admin
          !define MUI_ABORTWARNING
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"
          Section "Install"
              SetOutPath "$INSTDIR"
              File /r "dist\gfootball\*.*"
              CreateDirectory "$SMPROGRAMS\Google Research Football"
              CreateShortcut "$SMPROGRAMS\Google Research Football\GFootball.lnk" "$INSTDIR\GFootball.exe"
              CreateShortcut "$DESKTOP\Google Research Football.lnk" "$INSTDIR\GFootball.exe"
              WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\GFootball" "DisplayName" "Google Research Football"
              WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\GFootball" "UninstallString" "$INSTDIR\uninstall.exe"
              WriteUninstaller "$INSTDIR\uninstall.exe"
          SectionEnd
          Section "Uninstall"
              RMDir /r "$INSTDIR"
              RMDir /r "$SMPROGRAMS\Google Research Football"
              Delete "$DESKTOP\Google Research Football.lnk"
              DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\GFootball"
          SectionEnd
          '@
          Set-Content -Path "installer.nsi" -Value $nsi -Encoding ASCII

      - name: Build NSIS installer
        shell: pwsh
        run: |
          if (Test-Path "dist\gfootball") {
            & "C:\Program Files (x86)\NSIS\makensis.exe" /V4 installer.nsi
          }
        continue-on-error: true

      - name: Create portable zip
        shell: pwsh
        run: |
          if (Test-Path "dist\gfootball") {
            Compress-Archive -Path "dist\gfootball\*" -DestinationPath "GFootball_Portable.zip"
            Get-Item "GFootball_Portable.zip" | Format-List Name,Length
          }
        continue-on-error: true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            pyinstaller.log
            third_party/gfootball_engine/build_win/**/*.log
          if-no-files-found: ignore

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GFootball-Windows-Installer
          path: |
            GFootball_Setup.exe
            GFootball_Portable.zip
          if-no-files-found: warn

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: GFootball-Windows-Installer
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            GFootball_Setup.exe
            GFootball_Portable.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
